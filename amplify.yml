version: 1
backend:
  phases:
    build:
      commands:
        # The backend is deliberately NOT an npm workspace: Gatsby needs
        # graphql 16 and the Amplify data construct needs 15, and a single
        # hoisted tree cannot satisfy both. backend/ keeps its own lockfile
        # and node_modules.
        #
        # `install`, NOT `ci`. Several Amplify CDK packages ship bundled
        # dependencies (@aws-amplify/data-construct bundles
        # backend-output-schemas, backend-cli bundles its CDK toolchain), and
        # npm records the hoisted version in the lockfile while `npm ci`
        # rebuilds an ideal tree containing the bundled one. The two disagree,
        # so `npm ci` fails EUSAGE — "Missing: @aws-cdk/toolkit-lib@1.19.0
        # from lock file" — against a lockfile npm itself just wrote. It is
        # reproducible from a clean `npm install` and is not staleness.
        # `npm install` resolves against package.json and self-heals.
        # digitalhome-cloud-darkfactory's repos/core/amplify.yml made the same
        # call. atmanyoga-fullstack still has `ci` here and will fail its next
        # backend deploy for the same reason.
        - npm --prefix backend install
        #
        # Wrapped in a subshell. Amplify runs every command in this file in ONE
        # persistent shell session, so a bare `cd backend` leaks into the
        # frontend phase and the `npm ci` below then runs inside backend/
        # against the wrong lockfile. That failure looks nothing like a cwd
        # problem — it surfaces as EUSAGE "Missing: @opentelemetry/core@2.0.0",
        # a package the root lockfile does not even contain. The parentheses
        # are what keep the two phases independent.
        - (cd backend && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID)
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        # npm workspaces installs every package's dependencies from the root
        # lockfile, so there is no second install inside packages/site.
        - npm ci
        # pipeline-deploy writes amplify_outputs.json into backend/. The whole
        # site sits behind Cognito, so without it there is nothing to sign in
        # to — but the build is still allowed to succeed, because a
        # frontend-only rebuild (no backend phase) must not fail the branch.
        # AuthGate renders its "backend not configured" notice instead.
        - cp backend/amplify_outputs.json packages/site/src/amplify_outputs.json || echo "no backend outputs; the app will show the unconfigured notice"
    build:
      commands:
        # The workspace packages are plain tsc builds that packages/site
        # imports from dist/, so they must be built before Gatsby runs.
        - npm run build
  artifacts:
    baseDirectory: packages/site/public
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - backend/node_modules/**/*
      - packages/site/.cache/**/*
